[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revosim"
version = "0.1.0"
description = "Standalone high-fidelity Revo3 hands with multimodal tactile simulation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
dependencies = ["numpy>=1.26,<3", "scipy>=1.11", "trimesh>=4", "Pillow>=10", "imageio>=2.34", "imageio-ffmpeg>=0.5", "h5py>=3.11"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
revosim = ["apps/*.kit", "assets/**/*", "tactile/backends/third_party/**/*", "tactile/backends/*.json", "tactile/backends/*.md", "tactile/backends/SOURCE_LICENSE"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc"]
